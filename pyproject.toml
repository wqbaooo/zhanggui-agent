[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zhanggui-agent"
version = "0.1.0"
description = "掌柜Agent — 新余恒太城大口章鱼烧 AI 单店经营 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zhangui Team" }
]
dependencies = [
    "langgraph>=1.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "duckduckgo-search>=6.0,<7.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
whisper = [
    "openai-whisper>=20231117",
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
